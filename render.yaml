services:
  - type: web
    name: hanbit-wms-api
    runtime: node
    region: singapore
    plan: free
    rootDir: apps/api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hanbit-wms-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

  - type: web
    name: hanbit-wms-web
    runtime: node
    region: singapore
    plan: free
    rootDir: apps/web
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://hanbit-wms-api.onrender.com

databases:
  - name: hanbit-wms-db
    region: singapore
    plan: free
